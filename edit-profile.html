<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Mini Social Network</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Mini Social Network</h1>

        <nav>
            <a href="newsfeed.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <!-- EDIT PROFILE -->

    <main class="container">

        <div class="card">

            <h2>Edit Profile</h2>

            <form>

                <!-- PROFILE PICTURE -->

                <label for="profile-picture">
                    Profile Picture:
                </label>

                <input
                    type="file"
                    id="profile-picture"
                    name="profile-picture"
                    accept="image/*"
                >


                <!-- FULL NAME -->

                <label for="fullname">
                    Full Name:
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    value="Crystal Jane Cinco"
                    required
                >


                <!-- USERNAME -->

                <label for="username">
                    Username:
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="crystal"
                    required
                >


                <!-- BIO -->

                <label for="bio">
                    Bio:
                </label>

                <textarea
                    id="bio"
                    name="bio"
                    rows="5"
                    placeholder="Write something about yourself..."
                >Hello! Welcome to my profile. I enjoy connecting with friends and sharing my thoughts.</textarea>


                <!-- SAVE -->

                <button type="submit">
                    Save Changes
                </button>

            </form>


            <br>

            <a href="profile.html">
                Cancel
            </a>

        </div>

    </main>

</body>

</html>
